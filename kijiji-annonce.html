<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Image annonce Kijiji — OYYKR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 900px;
    font-family: "Aptos", "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(200, 232, 109, 0.35), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(44, 122, 72, 0.18), transparent 45%),
      linear-gradient(160deg, #f7fbef 0%, #fbfaf6 50%, #eef7f4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card {
    width: 1080px;
    text-align: center;
    padding: 60px 70px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 30px 80px rgba(23, 32, 31, 0.16);
    position: relative;
  }

  .verified-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 26px;
    background: #2c7a48;
    color: #ffffff;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .verified-badge .check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    background: #c8e86d;
    color: #17201f;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 900;
  }

  h1 {
    font-size: 46px;
    color: #17201f;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 26px;
    color: #52615f;
    margin-bottom: 36px;
  }

  .code-box {
    display: inline-block;
    padding: 34px 90px;
    border: 4px dashed #2c7a48;
    border-radius: 20px;
    background: rgba(200, 232, 109, 0.16);
    margin-bottom: 14px;
  }

  .code-label {
    font-size: 20px;
    color: #195733;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }

  .code {
    font-size: 120px;
    font-weight: 900;
    letter-spacing: 0.12em;
    color: #17201f;
    line-height: 1;
  }

  .amount {
    font-size: 40px;
    font-weight: 800;
    color: #2c7a48;
    margin: 26px 0 34px;
  }

  .amount strong { font-size: 52px; color: #195733; }

  .features {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 40px;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: #17201f;
  }

  .feature .dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2c7a48;
    color: #ffffff;
    font-size: 22px;
    font-weight: 900;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 30px;
    border-top: 2px solid #dfe5de;
  }

  .site {
    font-size: 32px;
    font-weight: 900;
    color: #195733;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="verified-badge"><span class="check">✓</span> Code vérifié et fonctionnel</div>
    <h1>Code de référence Fizz</h1>
    <p class="subtitle">Forfait mobile ou Internet résidentiel — Québec et Ontario</p>

    <div class="code-box">
      <span class="code-label">Votre code</span>
      <div class="code">OYYKR</div>
    </div>

    <p class="amount">Recevez <strong>25&nbsp;$</strong> de crédit sur votre facture</p>

    <div class="features">
      <div class="feature"><span class="dot">✓</span> Mobile</div>
      <div class="feature"><span class="dot">✓</span> Internet résidentiel</div>
      <div class="feature"><span class="dot">✓</span> 100&nbsp;% gratuit</div>
    </div>

    <div class="footer">
      <span class="site">codereferencefizz.ca</span>
    </div>
  </div>
</body>
</html>

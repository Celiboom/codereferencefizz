<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JWGZDBQ38G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JWGZDBQ38G');
    </script>
    <title>ProjetFZ | Redirection</title>
    <meta name="description" content="ProjetFZ vous redirige vers la version localisée du site.">
    <link rel="canonical" href="https://codereferencefizz.ca/fr/">
    <link rel="alternate" hreflang="fr-CA" href="https://codereferencefizz.ca/fr/">
    <link rel="alternate" hreflang="en-US" href="https://codereferencefizz.ca/en/">
    <link rel="alternate" hreflang="es-ES" href="https://codereferencefizz.ca/es/">
    <link rel="alternate" hreflang="x-default" href="https://codereferencefizz.ca/fr/">
    <meta http-equiv="refresh" content="2; url=fr/">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf6;
        color: #17201f;
        font-family: "Aptos", "Segoe UI", sans-serif;
      }

      main {
        max-width: 560px;
        padding: 32px;
      }

      a {
        color: #195733;
        font-weight: 800;
      }
    </style>
    <script>
      const cultureMap = {
        fr: "fr",
        "fr-ca": "fr",
        "fr-fr": "fr",
        en: "en",
        "en-ca": "en",
        "en-us": "en",
        "en-gb": "en",
        es: "es",
        "es-ca": "es",
        "es-es": "es",
        "es-mx": "es",
        "es-us": "es"
      };

      function normalizeCulture(culture) {
        if (!culture) {
          return "";
        }

        const normalized = String(culture).trim().toLowerCase().replace(/_/g, "-");
        const language = normalized.slice(0, 2);
        return cultureMap[normalized] || cultureMap[language] || "";
      }

      function chooseLanguage() {
        const requestedCulture = new URLSearchParams(window.location.search).get("culture");
        const requestedLanguage = normalizeCulture(requestedCulture);

        if (requestedLanguage) {
          return requestedLanguage;
        }

        const browserCultures = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language];

        for (let index = 0; index < browserCultures.length; index += 1) {
          const browserLanguage = normalizeCulture(browserCultures[index]);

          if (browserLanguage) {
            return browserLanguage;
          }
        }

        return "fr";
      }

      window.location.replace(`${chooseLanguage()}/`);
    </script>
  </head>
  <body>
    <main>
      <h1>ProjetFZ</h1>
      <p>Redirection vers la bonne langue...</p>
      <p>
        <a href="fr/">Français</a> |
        <a href="en/">English</a> |
        <a href="es/">Español</a>
      </p>
    </main>
  </body>
</html>
